name: CI

on:
  push:
    branches: [main, develop, 'refactor/**']
  pull_request:
    branches: [main, develop]

# Cancela runs antigos quando há push novo no mesmo branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint · Typecheck · Testes (unit + E2E)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: fleetops
          POSTGRES_PASSWORD: fleetops
          POSTGRES_DB: fleetops_test
          TZ: America/Sao_Paulo
          PGTZ: America/Sao_Paulo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      TZ: America/Sao_Paulo
      DATABASE_URL: postgresql://fleetops:fleetops@localhost:5432/fleetops_test
      JWT_SECRET: ci-jwt-secret-apenas-para-testes
      JWT_EXPIRATION: 7d
      NODE_ENV: test
      # Mapbox token só precisa em runtime; no CI usamos um dummy pra não quebrar build
      MAPBOX_TOKEN: pk.ci-dummy-token
      NEXT_PUBLIC_MAPBOX_TOKEN: pk.ci-dummy-token

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Configurar Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.13

      - name: Cache de dependências (bun)
        uses: actions/cache@v4
        with:
          path: |
            ~/.bun/install/cache
            node_modules
            apps/*/node_modules
            packages/*/node_modules
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lockb', 'bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Cache de build (turbo)
        uses: actions/cache@v4
        with:
          path: .turbo
          key: ${{ runner.os }}-turbo-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-turbo-

      - name: Instalar dependências
        run: bun install --frozen-lockfile

      - name: Gerar cliente Prisma
        working-directory: apps/api
        run: bunx prisma generate

      - name: Build dos packages compartilhados
        run: |
          bun run --filter='@fleetops/types' build
          bun run --filter='@fleetops/validation' build
          bun run --filter='@fleetops/utils' build

      - name: Verificar tipos (typecheck)
        run: bun run typecheck

      - name: Lint
        run: bun run lint

      - name: Executar migrations no banco de teste
        working-directory: apps/api
        run: bunx prisma migrate deploy

      - name: Rodar seed do banco de teste
        working-directory: apps/api
        run: bunx tsx prisma/seed.ts

      - name: Testes unitários (todos os pacotes)
        run: bun run test

      - name: Testes E2E da API
        working-directory: apps/api
        run: bun run test:e2e

      - name: Build do web (Next.js)
        working-directory: apps/web
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
