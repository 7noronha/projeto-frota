<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>FleetOps — Diagrama ER (coluna a coluna)</title>
<style>
  :root {
    --navy: #0a2540;
    --primary: #0066ff;
    --primary-dark: #0047b3;
    --accent: #00c2ff;
    --bg: #f8fafc;
    --surface: #ffffff;
    --border: #e2e8f0;
    --text: #0a2540;
    --muted: #64748b;
    --pk: #16a34a;
    --fk: #0066ff;
    --uk: #d97706;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    overflow: hidden;
  }

  header {
    background: linear-gradient(135deg, var(--navy) 0%, var(--primary-dark) 100%);
    color: white;
    padding: 16px 24px;
    box-shadow: 0 2px 8px rgba(10,37,64,0.15);
    display: flex;
    align-items: center;
    gap: 16px;
  }

  header h1 { margin: 0; font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
  header .stats { display: flex; gap: 16px; font-size: 12px; opacity: 0.9; }
  header .stats span b { color: var(--accent); }

  nav.tabs {
    display: flex;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 0 24px;
  }
  nav.tabs button {
    background: transparent; border: none; padding: 12px 18px; font-size: 13px;
    font-weight: 600; color: var(--muted); cursor: pointer;
    border-bottom: 3px solid transparent; font-family: inherit;
  }
  nav.tabs button:hover { color: var(--primary); }
  nav.tabs button.active { color: var(--primary); border-bottom-color: var(--primary); }

  .toolbar {
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    padding: 8px 24px;
    display: flex;
    gap: 8px;
    align-items: center;
    font-size: 12px;
  }
  .toolbar button {
    background: var(--bg); border: 1px solid var(--border);
    padding: 6px 10px; border-radius: 6px; cursor: pointer; font-size: 12px;
    color: var(--text); font-family: inherit;
  }
  .toolbar button:hover { border-color: var(--primary); color: var(--primary); }
  .toolbar .hint { color: var(--muted); margin-left: auto; font-size: 11px; }
  .toolbar .legend {
    display: flex; gap: 12px; align-items: center;
    padding-left: 16px; border-left: 1px solid var(--border);
  }
  .toolbar .legend span {
    display: flex; align-items: center; gap: 4px; color: var(--muted);
    font-size: 11px;
  }
  .toolbar .legend .badge-pk { background: var(--pk); }
  .toolbar .legend .badge-fk { background: var(--fk); }
  .toolbar .legend .badge-uk { background: var(--uk); }
  .toolbar .legend i {
    width: 8px; height: 8px; border-radius: 2px; display: inline-block;
  }

  .canvas {
    position: relative;
    width: 100vw;
    height: calc(100vh - 100px);
    overflow: auto;
    background:
      radial-gradient(circle at 1px 1px, #cbd5e1 1px, transparent 0);
    background-size: 24px 24px;
  }

  .canvas-inner {
    position: relative;
    transform-origin: top left;
    transition: transform 0.15s ease-out;
  }

  svg.lines {
    position: absolute;
    top: 0; left: 0;
    pointer-events: none;
    z-index: 1;
  }

  .tabela {
    position: absolute;
    background: var(--surface);
    border: 1.5px solid var(--border);
    border-radius: 10px;
    box-shadow: 0 2px 8px rgba(10,37,64,0.06);
    font-family: 'JetBrains Mono', 'Fira Code', Consolas, monospace;
    font-size: 11px;
    min-width: 220px;
    z-index: 2;
    user-select: none;
    overflow: hidden;
  }
  .tabela.lookup { border-color: #c7d2fe; background: #fafbff; }
  .tabela.despesa { border-color: #fcd9c1; background: #fffaf5; }
  .tabela.config { border-color: #d1fae5; background: #f0fdf7; }

  .tabela .titulo {
    background: var(--navy);
    color: white;
    padding: 8px 12px;
    font-weight: 700;
    font-size: 12px;
    letter-spacing: 0.3px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    cursor: grab;
  }
  .tabela.lookup .titulo { background: #4338ca; }
  .tabela.despesa .titulo { background: #ea580c; }
  .tabela.config .titulo { background: #047857; }

  .tabela .titulo:active { cursor: grabbing; }
  .tabela .titulo .ico {
    font-size: 10px; opacity: 0.7; font-weight: 500;
    background: rgba(255,255,255,0.18); padding: 1px 5px; border-radius: 4px;
  }

  .tabela .col {
    display: grid;
    grid-template-columns: auto 1fr auto;
    gap: 8px;
    padding: 4px 12px;
    border-bottom: 1px solid #f1f5f9;
    line-height: 1.4;
    align-items: center;
  }
  .tabela .col:last-child { border-bottom: none; }
  .tabela .col:hover { background: rgba(0, 102, 255, 0.04); }
  .tabela .col .nome { color: var(--text); font-weight: 500; }
  .tabela .col .tipo { color: var(--muted); font-size: 10px; }
  .tabela .col .badges { display: flex; gap: 3px; }

  .badge {
    background: var(--muted); color: white;
    font-size: 9px; font-weight: 700;
    padding: 1px 5px; border-radius: 3px;
    letter-spacing: 0.5px; font-family: 'Inter', sans-serif;
  }
  .badge.pk { background: var(--pk); }
  .badge.fk { background: var(--fk); }
  .badge.uk { background: var(--uk); }

  .panel { display: none; }
  .panel.active { display: block; }
</style>
</head>
<body>

<header>
  <h1>FleetOps — Diagrama ER</h1>
  <div class="stats">
    <span><b>22</b> tabelas</span>
    <span><b>9</b> lookups</span>
    <span><b>6</b> despesas</span>
    <span style="opacity:0.7;font-size:11px;margin-left:8px">Linhas conectam <b style="color:#00c2ff">FK → PK</b> direto na coluna</span>
  </div>
</header>

<nav class="tabs">
  <button class="active" data-tab="core">Core (Usuários · Veículos · Viagens · GPS)</button>
  <button data-tab="despesas">Despesas (6 subtipos)</button>
</nav>

<div class="toolbar">
  <button onclick="aplicarZoom(0.6)">60%</button>
  <button onclick="aplicarZoom(0.8)">80%</button>
  <button onclick="aplicarZoom(1)">100%</button>
  <button onclick="aplicarZoom(1.25)">125%</button>
  <button onclick="aplicarZoom(1.5)">150%</button>
  <button onclick="ajustarTela()">Ajustar à tela</button>
  <div class="legend">
    <span><i class="badge-pk"></i> PK</span>
    <span><i class="badge-fk"></i> FK</span>
    <span><i class="badge-uk"></i> UK</span>
  </div>
  <div class="hint">Arraste o cabeçalho das tabelas para reposicionar · Scroll do mouse para zoom</div>
</div>

<div class="canvas" id="canvas">
  <div class="canvas-inner" id="canvas-inner">
    <svg class="lines" id="lines" width="3000" height="2200"></svg>
    <div class="panel active" id="panel-core"></div>
    <div class="panel" id="panel-despesas"></div>
  </div>
</div>

// ────────────────────────────────────────────────────────────────────────────
// RENDER: monta o HTML das tabelas e desenha as linhas SVG.
// ────────────────────────────────────────────────────────────────────────────

let tabAtual = 'core';
let escala = 0.8;

function renderTabela(panel, tab) {
  const ts = SCHEMAS[tab];
  panel.innerHTML = '';

  ts.forEach(t => {
    const div = document.createElement('div');
    div.className = 'tabela ' + t.tipo;
    div.id = 'tab-' + tab + '-' + t.id;
    div.style.left = t.x + 'px';
    div.style.top = t.y + 'px';
    div.dataset.tableId = t.id;

    const tag = t.tag ? `<span class="ico">${t.tag}</span>` : '';
    let html = `<div class="titulo" data-drag="${t.id}">${t.label}${tag}</div>`;
    t.cols.forEach(c => {
      const badges = [];
      if (c.pk) badges.push('<span class="badge pk">PK</span>');
      if (c.fk) badges.push('<span class="badge fk">FK</span>');
      if (c.uk) badges.push('<span class="badge uk">UK</span>');
      html += `
        <div class="col" data-col="${c.name}" data-table="${t.id}">
          <span class="nome">${c.name}</span>
          <span class="tipo">${c.type}</span>
          <span class="badges">${badges.join('')}</span>
        </div>
      `;
    });
    div.innerHTML = html;
    panel.appendChild(div);
  });
}

function desenharLinhas() {
  const svg = document.getElementById('lines');
  svg.innerHTML = `
    <defs>
      <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5"
        markerWidth="8" markerHeight="8" orient="auto-start-reverse">
        <path d="M 0 0 L 10 5 L 0 10 z" fill="#0066ff"/>
      </marker>
      <marker id="dot" viewBox="0 0 6 6" refX="3" refY="3"
        markerWidth="6" markerHeight="6">
        <circle cx="3" cy="3" r="2.5" fill="#16a34a"/>
      </marker>
    </defs>
  `;

  const ts = SCHEMAS[tabAtual];
  const containerRect = document.getElementById('canvas-inner').getBoundingClientRect();

  ts.forEach(t => {
    t.cols.forEach(c => {
      if (!c.fk) return;
      const [refTable, refCol] = c.fk.split('.');

      const origem = document.querySelector(
        `#tab-${tabAtual}-${t.id} [data-col="${c.name}"]`
      );
      const destino = document.querySelector(
        `#tab-${tabAtual}-${refTable} [data-col="${refCol}"]`
      );
      if (!origem || !destino) return;

      const oRect = origem.getBoundingClientRect();
      const dRect = destino.getBoundingClientRect();

      // Posições relativas ao container (compensando escala)
      const ox = (oRect.left - containerRect.left) / escala;
      const oy = (oRect.top + oRect.height / 2 - containerRect.top) / escala;
      const oRight = (oRect.right - containerRect.left) / escala;

      const dx = (dRect.left - containerRect.left) / escala;
      const dy = (dRect.top + dRect.height / 2 - containerRect.top) / escala;
      const dRight = (dRect.right - containerRect.left) / escala;

      // Escolhe o lado mais curto pra cada ponta
      const oFromLeft = ox < dx;
      const startX = oFromLeft ? oRight : ox;
      const endX = oFromLeft ? dx : dRight;

      // Curva de bezier suave
      const distancia = Math.abs(endX - startX);
      const curva = Math.min(160, Math.max(40, distancia * 0.4));
      const c1x = oFromLeft ? startX + curva : startX - curva;
      const c2x = oFromLeft ? endX - curva : endX + curva;

      const path = document.createElementNS('http://www.w3.org/2000/svg', 'path');
      path.setAttribute('d', `M ${startX} ${oy} C ${c1x} ${oy}, ${c2x} ${dy}, ${endX} ${dy}`);
      path.setAttribute('stroke', '#0066ff');
      path.setAttribute('stroke-width', '1.8');
      path.setAttribute('fill', 'none');
      path.setAttribute('opacity', '0.65');
      path.setAttribute('marker-end', 'url(#dot)');
      svg.appendChild(path);

      // Marca a coluna FK com indicador visual sutil (sublinhado azul)
      origem.style.borderLeft = '2px solid #0066ff';
    });
  });
}

// ────────────────────────────────────────────────────────────────────────────
// INTERATIVIDADE: drag das tabelas + tabs + zoom
// ────────────────────────────────────────────────────────────────────────────

function setupDrag() {
  let dragging = null;
  let dx = 0, dy = 0;

  document.addEventListener('mousedown', e => {
    const titulo = e.target.closest('.titulo');
    if (!titulo) return;
    const tabela = titulo.parentElement;
    dragging = tabela;
    const rect = tabela.getBoundingClientRect();
    dx = (e.clientX - rect.left) / escala;
    dy = (e.clientY - rect.top) / escala;
    e.preventDefault();
  });

  document.addEventListener('mousemove', e => {
    if (!dragging) return;
    const container = document.getElementById('canvas-inner');
    const cRect = container.getBoundingClientRect();
    const novoX = (e.clientX - cRect.left) / escala - dx;
    const novoY = (e.clientY - cRect.top) / escala - dy;
    dragging.style.left = Math.max(0, novoX) + 'px';
    dragging.style.top = Math.max(0, novoY) + 'px';
    desenharLinhas();
  });

  document.addEventListener('mouseup', () => { dragging = null; });
}

function trocarAba(tab) {
  tabAtual = tab;
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.querySelectorAll('.panel').forEach(p => p.classList.toggle('active', p.id === 'panel-' + tab));

  const panel = document.getElementById('panel-' + tab);
  if (panel.childElementCount === 0) {
    renderTabela(panel, tab);
  }
  requestAnimationFrame(desenharLinhas);
}

function aplicarZoom(z) {
  escala = z;
  document.getElementById('canvas-inner').style.transform = `scale(${z})`;
  requestAnimationFrame(desenharLinhas);
}

function ajustarTela() {
  const canvas = document.getElementById('canvas');
  const inner = document.getElementById('canvas-inner');
  const tabelas = inner.querySelectorAll('.panel.active .tabela');
  if (tabelas.length === 0) return;

  let maxX = 0, maxY = 0;
  tabelas.forEach(t => {
    const r = t.getBoundingClientRect();
    const innerRect = inner.getBoundingClientRect();
    const right = (r.right - innerRect.left) / escala;
    const bottom = (r.bottom - innerRect.top) / escala;
    if (right > maxX) maxX = right;
    if (bottom > maxY) maxY = bottom;
  });

  const fitX = (canvas.clientWidth - 60) / maxX;
  const fitY = (canvas.clientHeight - 60) / maxY;
  aplicarZoom(Math.min(fitX, fitY, 1));
}

document.querySelectorAll('nav.tabs button').forEach(btn => {
  btn.addEventListener('click', () => trocarAba(btn.dataset.tab));
});

// Scroll do mouse + Ctrl pra zoom
document.getElementById('canvas').addEventListener('wheel', e => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  const delta = e.deltaY < 0 ? 0.1 : -0.1;
  aplicarZoom(Math.max(0.3, Math.min(2, escala + delta)));
}, { passive: false });

// Init
window.addEventListener('load', () => {
  setupDrag();
  trocarAba('core');
  aplicarZoom(0.8);
  setTimeout(ajustarTela, 200);
});
</script>
